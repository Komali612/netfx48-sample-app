name: 'Netfx48SampleApp CI Pipeline'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-publish:
    name: Build, Publish and Upload ZIP
    runs-on: windows-2022
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
      - name: 'Setup .NET'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 'Setup MSBuild'
        uses: microsoft/setup-msbuild@v2
      - name: 'Restore NuGet packages'
        shell: pwsh
        run: |
          $packagesDirectory = Join-Path $env:GITHUB_WORKSPACE "packages"
          New-Item -ItemType Directory -Path $packagesDirectory -Force | Out-Null
          nuget restore "netfx48-sample-app.csproj" -PackagesDirectory "$packagesDirectory"
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed." }
      - name: 'Build application'
        shell: pwsh
        run: |
          msbuild "netfx48-sample-app.csproj" /p:Configuration=Release /p:Platform="AnyCPU"
          if ($LASTEXITCODE -ne 0) { throw "Application build failed." }
      - name: 'Publish application'
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $env:GITHUB_WORKSPACE "publish"
          if (Test-Path $publishDirectory) { Remove-Item $publishDirectory -Recurse -Force }
          New-Item -ItemType Directory -Path $publishDirectory -Force | Out-Null
          msbuild "netfx48-sample-app.csproj" /t:WebPublish /p:Configuration=Release /p:Platform="AnyCPU" /p:WebPublishMethod=FileSystem /p:publishUrl="$publishDirectory" /p:DeleteExistingFiles=true
          if ($LASTEXITCODE -ne 0) { throw "Application publish failed." }
      - name: 'Create ZIP'
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $env:GITHUB_WORKSPACE "publish"
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "Netfx48SampleApp.zip"
          Compress-Archive -Path "$publishDirectory\*" -DestinationPath $zipPath -Force
          if (!(Test-Path $zipPath)) { throw "ZIP file was not created." }
      - name: 'Upload ZIP artifact'
        uses: actions/upload-artifact@v4
        with:
          name: 'Netfx48SampleApp'
          path: 'Netfx48SampleApp.zip'
          if-no-files-found: 'error'
